name: Notify Mattermost on push

on:
  push: {}
  pull_request: 
    types: [opened, reopened, synchronize]
jobs:
  notify-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Send notification to Mattermost
        env:
          MM_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          PUSHER_NAME: ${{ github.event.pusher.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
            NAME="${PUSHER_NAME:-$ACTOR}"

            TEXT=$(cat <<EOF
            ${NAME}さんが${BRANCH}にpushしました。
            [Github](${COMMIT_URL})
            コミットメッセージ: ${COMMIT_MSG}
            EOF)
            export TEXT
            
            payload=$(python3 -c 'import json,os; print(json.dumps({"text": os.environ["TEXT"]}))')
            
            curl -sS -X POST -H "Content-Type: application/json" \
                  -d "$payload" \
                   "$MM_WEBHOOK"
  notify-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Send PR notification to Mattermost
        env:
          MM_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          ACTION: ${{ github.event.action }}
        run: |
          # opened / reopened / synchronize を日本語に寄せる
          case "$ACTION" in
            opened)    ACTION_JA="作成しました" ;;
            reopened)  ACTION_JA="再オープンしました" ;;
            synchronize) ACTION_JA="更新しました" ;;  # 追加pushでPRが更新された時
            *)         ACTION_JA="更新しました" ;;
          esac

          TEXT="${ACTOR}さんがPRを${ACTION_JA}。(${HEAD} → ${BASE})\n${PR_URL}\nタイトル: ${PR_TITLE}"
          export TEXT

          payload=$(python3 -c 'import json,os; print(json.dumps({"text": os.environ["TEXT"]}))')

          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$payload" \
            "$MM_WEBHOOK"
