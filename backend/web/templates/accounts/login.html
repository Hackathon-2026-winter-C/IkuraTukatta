{% extends 'base.html' %} {% load static %} {% block title %}ログイン{% endblock title %} {% block content %}
<h2 class="text-[rgb(var(--app-text))]">ログインページ</h2>

<main class="bg-black flex flex-col items-center min-h-[100dvh] w-full justify-end gap-6">
  {% comment %} ロゴ画像 {% endcomment %}
  <div class="pt-8 pb-4">
    <img src="{% static 'assets/images/login.png' %}" alt="いくらつかった？" class="w-[80vw] max-w-[380px]" />
  </div>

  {% comment %} ログインフォーム {% endcomment %}
  <div class="neu-panel w-full">
    <form class="auth-form" method="get" action="{% url 'dashboard' %}">
      <input type="email" class="input" placeholder="メールアドレス" />
      <input type="password" class="input" placeholder="パスワード" />

      <button type="submit" class="btn btn-main">Login</button>

      <div class="text-center text-black my-2">OR</div>

      <button type="button" class="btn btn-sub flex items-center justify-center gap-2">
        <img src="{% static 'assets/images/google.svg' %}" alt="Google" class="w-4 h-4" />
        <span>Continue with Google</span>
      </button>

      <div class="text-center text-black my-2">
        アカウントをお持ちでない方は
        <a href="{% url 'signup' %}" class="text-[#FF9400] font-bold">こちら</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
