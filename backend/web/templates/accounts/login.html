{% extends 'base.html' %}
{% load static %}

{% block title %}ログイン{% endblock title %}

{% block content %}
<main class="bg-black flex flex-col items-center min-h-[100dvh] w-full justify-end gap-6">
  {# ロゴ画像 #}
  <div class="pt-8 pb-4">
    <img src="{% static 'assets/images/login.png' %}" alt="いくらつかった？" class="w-[80vw] max-w-[380px]" />
  </div>

  <div class="neu-panel w-full">
    {% if error %}
      <div class="text-red-400 text-sm mb-3">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <input type="text" name="username" class="input" placeholder="ユーザー名" required />
      <input type="password" name="password" class="input" placeholder="パスワード" required />

      <label class="flex items-center gap-2 text-white">
        <input type="checkbox" name="remember_me" class="accent-[#FF9400]">
        <span>ログイン状態を保持する</span>
      </label>

      <button type="submit" class="btn btn-main">Login</button>
    </form>

    <div class="text-center text-black my-2">OR</div>

    <button type="button" class="btn btn-sub flex items-center justify-center gap-2">
      <img src="{% static 'assets/images/google.svg' %}" alt="Google" class="w-4 h-4" />
      <span>Continue with Google</span>
    </button>

    <div class="text-center text-black my-2">
      アカウントをお持ちでない方は
      <a href="{% url 'signup' %}" class="text-[#FF9400] font-bold">こちら</a>
    </div>
  </div>
</main>
{% endblock content %}
