<!-- backend/web/templates/dashboard/calendar.html -->
{% extends "base.html" %}

{% load static %}

{% block title %}Calender{% endblock %}

{% block content %}
  <div class="min-h-[calc(100vh-4rem)] flex items-stretch justify-center bg-slate-100 rounded-3xl pt-5">
    <div class="card w-full h-full max-w-2xl bg-base-100 shadow-xl">
      <div class="card-body">
        <div class="flex items-center justify-between">
          <h2 class="card-title">カレンダー</h2>
          <span class="badge badge-outline">{{ month_label }}</span>
        </div>

        <div class="mt-4 grid grid-cols-7 text-center text-xs font-semibold text-base-content/70">
          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
        </div>
        <div class="mt-2 grid grid-cols-7 gap-2 text-center">
          {% for week in weeks %}
            {% for day in week %}
              {% if day == 0 %}
                <div class="h-10 rounded-lg bg-base-200/60"></div>
                <!-- buttons: add data-hover -->
              {% elif day == today_day %}
                <button type="button" class="calendar-day h-10 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold cursor-pointer transition-colors" data-selected="1" data-base-bg="bg-amber-200" data-base-text="text-black">
                  {{ day }}
                </button>
              {% else %}
                <button type="button" class="calendar-day h-10 rounded-lg bg-base-200 text-base-content flex items-center justify-center cursor-pointer transition-colors hover:bg-base-300" data-base-bg="bg-base-200" data-base-text="text-base-content" data-hover="hover:bg-base-300">
                  {{ day }}
                </button>
              {% endif %}
            {% endfor %}
          {% endfor %}
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="{% static 'js/dashboard.js' %}"></script>

{% endblock %}
