<!-- prettier-ignore -->
{% extends "base.html" %} 
{% load static %} 
{% block title %}Charts{% endblock %} 
{% block content %}

<main class="w-full flex flex-col items-center gap-4 px-4 pt-3 pb-3">
  <div class="w-full max-w-[420px] flex flex-col gap-3">
    <!-- ===== 共有プルダウン ===== -->
    <div id="ledger-switcher" class="ledger-switcher w-full mb-2.5">
      <button type="button" id="ledger-switcher-btn" class="ledger-switcher__btn">
        <div class="flex items-center gap-2">
          <span id="ledger-switcher-label" class="text-base text-[rgb(var(--app-text))]">読み込み中…</span>
          <span id="ledger-switcher-badge" class="ledger-switcher__badge">表示中</span>
        </div>

        <span id="ledger-switcher-chevron" class="transition-transform duration-200"> {% include "icons/ui/chevron-down.svg" %} </span>
      </button>

      <div id="ledger-switcher-menu" class="ledger-switcher__menu" aria-hidden="true"></div>
    </div>

    <!-- ===== Segmented (Charts: Year / Month) ===== -->
    <div id="charts-seg" class="relative flex w-full h-10 rounded-full p-1 border border-white/25 bg-white/15 backdrop-blur-lg app-shadow">
      <!-- slider -->
      <div id="charts-slider" class="absolute top-1 bottom-1 left-1 rounded-full bg-white shadow-[0_3px_12px_rgba(0,0,0,0.12),0_1px_4px_rgba(0,0,0,0.08)] transition-[left,width] duration-300"></div>

      <!-- Year -->
      <div class="relative z-10 flex-1">
        <input type="radio" name="chart-period" id="chart-year" value="year" class="peer absolute inset-0 opacity-0 cursor-pointer" checked />
        <label for="chart-year" class="flex h-full items-center justify-center rounded-full px-3 text-[13px] font-semibold text-white/80 select-none cursor-pointer transition-colors hover:text-white/95 peer-checked:text-[#FF9400]">Year</label>
      </div>

      <!-- Month -->
      <div class="relative z-10 flex-1">
        <input type="radio" name="chart-period" id="chart-month" value="month" class="peer absolute inset-0 opacity-0 cursor-pointer" />
        <label for="chart-month" class="flex h-full items-center justify-center rounded-full px-3 text-[13px] font-semibold text-white/80 select-none cursor-pointer transition-colors hover:text-white/95 peer-checked:text-[#FF9400]">Month</label>
      </div>
    </div>

    <!-- chart -->
    <div class="card w-full mb-2.5 bg-[rgb(var(--app-bg))] app-shadow">
      <div class="p-4 h-64 shadow flex justify-center items-center rounded-[30px] bg-transparent">
        <canvas id="expense-chart" class="w-48 h-48"></canvas>
        <div id="chart-empty" class="mt-2 text-sm text-[rgb(var(--app-text))]" hidden>まだデータがありません。</div>
      </div>
    </div>

    <!-- categories -->
    <div class="card w-full bg-[rgb(var(--app-bg))] app-shadow">
      <div id="chart-categories" class="mt-2.5 p-5 text-xl text-[rgb(var(--app-text))]"></div>
    </div>
  </div>
  <script src="{% static 'js/ledger-switcher.js' %}" defer></script>
</main>

{{ expense_data|json_script:"expense-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{% static 'js/charts.js' %}"></script>
<script src="{% static 'js/charts_categorys.js' %}"></script>

<!-- 共通スライダー -->
<script src="{% static 'js/segmented.js' %}"></script>

<!-- period switch -->
<script src="{% static 'js/charts_period_switcher.js' %}"></script>

<script>
  initSegmented({
    rootId: "charts-seg",
    sliderId: "charts-slider",
    radioName: "chart-period",
  });
</script>

{% endblock %}
